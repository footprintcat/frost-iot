
# Gradle Wrapper 升级命令
# https://docs.gradle.org.cn/current/userguide/gradle_wrapper.html
# 以下命令将 Wrapper 升级到特定版本
# ./gradlew wrapper --gradle-version {gradleVersion} // MacOs, Linux
# gradlew.bat wrapper --gradle-version {gradleVersion} // Windows

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
#distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
