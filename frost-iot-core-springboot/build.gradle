plugins {
    id 'java'
    // id 'application'  // 覆盖父项目的 java-library
    id 'org.springframework.boot' version '3.5.6' // springboot 3.x
    // id 'org.springframework.boot' version '4.0.0-M3' // springboot 4.x
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

// group = FROST_APP_GROUP
// version = FROST_APP_VERSION

// java {
//     toolchain {
//         languageVersion = JavaLanguageVersion.of(17)
//     }
// }

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    // 保留 mavenCentral(), 确保在 IDEA 中，通过代码点击进依赖源码时，右上角 [下载源代码] 按钮可以正常使用
    mavenCentral()
}

// 依赖管理
dependencyManagement {
    imports {
        mavenBom "com.baomidou:mybatis-plus-bom:3.5.14"
    }
}

dependencies {
    // implementation platform(...) 仅传递版本约束，不传递实际依赖。例如: 统一版本管理（BOM）
    // implementation project(...)  传递所有依赖（代码 + 依赖项）

    // 必需依赖
    // implementation platform(project(":frost-iot-dependencies"))
    implementation project(":frost-iot-dependencies")
    implementation project(":common")
    implementation project(":network-topology")

    // SpringBoot 相关依赖
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // implementation 'org.springframework.boot:spring-boot-configuration-processor' // 加载 application.*.yml
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // logback
    // fix warning:
    // SLF4J(W): No SLF4J providers were found.
    // SLF4J(W): Defaulting to no-operation (NOP) logger implementation
    // SLF4J(W): See https://www.slf4j.org/codes.html#noProviders for further details.
    runtimeOnly 'ch.qos.logback:logback-classic'
    compileOnly 'ch.qos.logback:logback-classic'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 数据库
    runtimeOnly 'org.postgresql:postgresql' // PostgreSQL 驱动
    implementation 'com.taosdata.jdbc:taos-jdbcdriver:3.7.6' // TDengine 驱动

    // jetbrains 编译时注解
    // implementation 'org.jetbrains:annotations:${libraries.jetbrainsAnnotations}'
    implementation 'org.jetbrains:annotations:26.0.2'

    // fastjson2
    // implementation 'com.alibaba.fastjson2:fastjson2:2.0.60'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.58'

    // mybatis-plus
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter'
    implementation 'com.baomidou:mybatis-plus-jsqlparser'

    // 多数据源
    implementation 'com.baomidou:dynamic-datasource-spring-boot3-starter:4.3.1'

    // OpenAPI/Swagger Support
    // OpenAPI 注解支持
    // springboot 3.x
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    // springboot 4.x
    // implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0-M1'

    // GraalVM
    compileOnly 'org.graalvm.sdk:graal-sdk:22.3.1'

    // 其他业务依赖
    // ...

    // see: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-with-GraalVM#logging
    // cite: Commons Logging should be excluded in Spring Applications as spring-jcl provides its own version and having both leads to duplicated classpath entries.
    configurations.configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// GraalVM 打原生包相关配置
graalvmNative {
    binaries {
        main {
            imageName = "frost-iot-core"

            // 启用实验性选项支持
            // fix these warnings:
            // - Warning: The option '-H:-SharedLibrary' is experimental and must be enabled via '-H:+UnlockExperimentalVMOptions' in the future.
            buildArgs.add("-H:+UnlockExperimentalVMOptions") // 注意顺序，需要放在其他参数前面

            // 如果静态分析发现代码里存在未经配置的动态特性（如反射、动态代理、JNI、资源加载等）
            // 直接报错并终止构建，而不是退而求其次地生成一个仍需 JDK 的“fallback”可执行文件
            buildArgs.add("--no-fallback")
            buildArgs.add("-H:-SharedLibrary")  // ✅ 关键, 强制指定生成 exe 而不是 dll

            buildArgs.add("--enable-url-protocols=http")
            buildArgs.add("--features=com.footprintcat.frostiot.core.springboot.config.LambdaRegistrationFeature")

            // fastjson2
            buildArgs.addAll(
                    "--initialize-at-build-time=com.alibaba.fastjson2.JSONFactory\$CacheItem",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToDouble",
                    "--initialize-at-build-time=com.alibaba.fastjson2.writer.ObjectWriterBaseModule",
                    "--initialize-at-build-time=com.alibaba.fastjson2.reader.ObjectReaderBaseModule",
                    "--initialize-at-build-time=com.alibaba.fastjson2.JSONReader\$Context",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.StringToAny",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToBigDecimal",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToBigInteger",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToBoolean",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToByte",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToFloat",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToInteger",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToLong",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToNumber",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToShort",
                    "--initialize-at-build-time=com.alibaba.fastjson2.function.impl.ToString",
                    "--initialize-at-build-time=com.alibaba.fastjson2.reader.ObjectReaderBaseModule\$ReaderAnnotationProcessor",
                    "--initialize-at-build-time=com.alibaba.fastjson2.reader.ObjectReaderCreator\$LambdaSetterInfo",
                    "--initialize-at-build-time=com.alibaba.fastjson2.reader.ObjectReaderImplString",
                    "--initialize-at-build-time=com.alibaba.fastjson2.reader.ObjectReaderProvider\$LRUAutoTypeCache",
                    "--initialize-at-build-time=com.alibaba.fastjson2.util.ParameterizedTypeImpl",
                    "--initialize-at-build-time=com.alibaba.fastjson2.util.TypeUtils\$Cache",
                    "--initialize-at-build-time=com.alibaba.fastjson2.writer.ObjectWriterBaseModule\$WriterAnnotationProcessor",
                    "--initialize-at-build-time=com.alibaba.fastjson2.writer.ObjectWriterCreator\$LambdaInfo"
            )
        }
    }
}
