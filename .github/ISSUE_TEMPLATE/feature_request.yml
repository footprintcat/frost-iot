name: Feature Request
description: 请求一个新功能或改进
title: "Feature: 功能改进"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提出功能建议！请填写以下信息。

        Issue 提交须知：
        1. 请按此模板提交 Issue，不按模板提交的问题将直接关闭
        2. 提问前请仔细阅读官网文档并搜索 Issue 记录，文档中已说明的问题、Issue 中已解答问题不再次解答
        3. 如果你使用的版本号不是最新版，请升级最新版后验证是否存在此问题
        4. 提交问题务必描述清楚、附上日志，描述不清导致无法理解和分析的问题会被直接关闭
        5. 不得通过 Issue 来提交项目无关内容，例如：为其他项目打广告
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 在提交 Issue 之前，请确认你已经阅读并确认以下内容
      options:
        - label: 我已阅读官网文档，并在 [Issue 列表](https://github.com/footprintcat/frost-iot/issues) 中搜索过，确认需求没有被提出过
          required: true
        - label: 我使用的版本是最新版
          required: true
        - label: "我已修改 Issue Feature: + 空格 + 功能改进描述"
          required: true
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请详细描述您想要的功能
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要这个功能？
      description: 这个功能将解决什么问题或带来什么价值？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您考虑过哪些替代方案？
  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 任何其他可能有帮助的信息
  - type: checkboxes
    id: cla
    attributes:
      label: 确认
      description: |
        感谢您的提交。在提交前，需要您阅读并同意[贡献者许可协议](https://github.com/footprintcat/frost-iot/blob/main/CLA.md)
      options:
        - label: 我已阅读并同意贡献者许可协议。
          required: true
        - label: 我的贡献不包含第三方受版权保护的内容，并已知晓违反协议可能导致 PR 被关闭及账户封禁
          required: true
