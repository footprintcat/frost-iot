// Maven Scope → Gradle 配置对照表
// | Maven Scope       | Gradle 配置              | 作用                                                                 |
// |-------------------|--------------------------|--------------------------------------------------------------------|
// | `compile`         | `implementation`         | 默认范围，编译和运行时都可用（推荐使用 `implementation` 而非已废弃的 `compile`） |
// | `provided`        | `compileOnly`            | 仅在编译时使用，不打包到最终产物（如 WAR/JAR）                          |
// | `runtime`         | `runtimeOnly`            | 仅在运行时使用，编译时不可见                                             |
// | `test`            | `testImplementation`     | 仅用于测试代码的编译和运行                                               |
// | `system`          | 自定义（不推荐）            | 类似 `provided`，但需手动指定本地路径（不推荐，尽量用仓库依赖）               |
// | `import`          | `platform`               | 用于 BOM 导入（如 `<dependencyManagement>`）                          |
